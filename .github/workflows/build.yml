name: build-apk
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: Android SDK (platform 34 + build-tools)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: fetch binaries
        run: bash scripts/fetch_binaries.sh

      - name: signing key
        env:
          HAVE_KEY: ${{ secrets.KEYSTORE_B64 != '' && secrets.KEYSTORE_PASSWORD != '' }}
        run: |
          if [ "$HAVE_KEY" = "true" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          else
            bash scripts/make_keystore.sh "$RUNNER_TEMP/release.keystore" | tee "$RUNNER_TEMP/ks.out" | sed -n "1p"
            echo "KEYSTORE_PASSWORD=$(sed -n "s/^KEYSTORE_PASSWORD=//p" "$RUNNER_TEMP/ks.out")" >> "$GITHUB_ENV"
            rm -f "$RUNNER_TEMP/ks.out"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=key" >> "$GITHUB_ENV"

      - name: build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: check APK
        env:
          HAVE_KEY: ${{ secrets.KEYSTORE_B64 != '' && secrets.KEYSTORE_PASSWORD != '' }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | head -8
          "$BT/aapt" dump badging "$APK" | head -4
          FP=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          {
            echo "### امضا و نسخه"
            echo "- versionCode: ${{ github.run_number }}"
            echo "- اثرانگشت امضا (SHA-256): \`$FP\`"
            if [ "$HAVE_KEY" = "true" ]; then
              echo "- کلید ثابت: این APK روی نسخه‌ی قبلی (با همین اثرانگشت) بدون حذف نصب می‌شه."
            else
              echo "- ⚠️ کلید ثابت تنظیم نشده؛ این بیلد با کلید موقت امضا شده و روی نسخه‌ی قبلی نصب نمی‌شه (باید حذف و دوباره نصب بشه). Secretهای KEYSTORE_B64 و KEYSTORE_PASSWORD رو بذار."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/|assets/geo/|assets/web/" | awk "{print \$1, \$4}"
          unzip -l "$APK" | grep -E "lib/(armeabi|x86)" && { echo "extra ABI found"; exit 1; } || true

      - uses: actions/upload-artifact@v4
        with:
          name: ConfigTool-apk
          path: app/build/outputs/apk/release/app-release.apk
